services:
  - type: web
    name: mexora-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SCHEDULER_INTERVAL_MINUTES
        value: "2"
      - key: MAX_ARTICLES_PER_CYCLE
        value: "10"
      - key: MAX_GEMINI_ARTICLES
        value: "3"
      - key: ALLOWED_ORIGINS
        value: "*"
